num_problems: 10

max_workers: 5

output_dir: "./results"

default_batch_id: "batch_01"

engineer_model:
  provider: "gemini"
  model_name: "gemini-3.1-pro-preview"
  temperature: 0.7
  max_output_tokens: 2048

checker_model:
  provider: "gemini"
  model_name: "gemini-3.1-pro-preview"
  temperature: 0.2
  max_output_tokens: 2048

target_model:
  provider: "gemini"
  model_name: "gemini-3.1-pro-preview"
  temperature: 0.4
  max_output_tokens: 3072

quality:
  min_score: 0.80
  require_checker_pass: true
  max_refinement_attempts: 2
